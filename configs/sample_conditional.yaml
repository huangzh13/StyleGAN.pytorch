# Conditional training example.
#
# ImageFolder uses the immediate subdirectory names as class labels. For
# example, a two-class dataset should look like:
#   data/conditional/class_a/image-001.jpg
#   data/conditional/class_b/image-001.jpg

output_dir: './output/conditional'
structure: 'linear'
conditional: True
n_classes: 2
loss: 'conditional-loss'
device: 'cuda'
device_id: ('0')
dataset:
  img_dir: './data/conditional'
  folder: False
  resolution: 128
sched:
  epochs: [2,4,4,4,4,8]
